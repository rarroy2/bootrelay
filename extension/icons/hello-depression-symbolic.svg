<!--
  Hello Depression - segmented restart ring.

  Original artwork: a circular restart arrow split into four segments, with a
  gap and an arrowhead. No Microsoft logo or trademarked artwork is used.

  Symbolic icons are recoloured by the theme using their alpha channel, so the
  neutral grey here only matters when GNOME falls back to rendering the file
  directly (for example when the icon theme cache is stale).
-->
